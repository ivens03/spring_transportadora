# Valores fixos para teste (não dependem do .env). O banco vem do Testcontainers.
SERVER_PORT=0
POSTGRES_HOST=localhost
POSTGRES_PORT=5432
POSTGRES_DB=teste
POSTGRES_USER=teste
POSTGRES_PASSWORD=teste
ROTACERTA_JWT_SEGREDO=segredo-de-teste-com-mais-de-32-bytes-0123456789
ROTACERTA_PEPPER=cGVwcGVyLWRlLXRlc3RlLWNvbS0zMi1ieXRlcy0xMjM0
ROTACERTA_ADMIN_EMAIL=admin@teste.local
ROTACERTA_ADMIN_SENHA=SenhaAdmin123

# Webhooks: receptor local (http://127.0.0.1) e o teste chama o despachante na mão
rotacerta.webhook.exigir-https=false
rotacerta.webhook.permitir-rede-interna=true
rotacerta.webhook.despacho-automatico=false
rotacerta.webhook.espera-inicial=1s
