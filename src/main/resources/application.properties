spring.application.name=rotacerta

# Lê o .env da raiz do projeto como se fosse um .properties (segredos ficam fora do git).
# Em servidor, as mesmas chaves podem vir como variáveis de ambiente de verdade.
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT}

# --- Banco ---
# Rodando local, o spring-boot-docker-compose sobe o compose.yaml e usa a conexão do container.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.docker.compose.lifecycle-management=start-only
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Token (JWT) ---
rotacerta.jwt.emissor=rotacerta
rotacerta.jwt.segredo=${ROTACERTA_JWT_SEGREDO}

# --- Credenciais ---
# App do entregador: token cobre a jornada (conexão instável, evita relogin na rua).
rotacerta.credencial.validade-token-app=12h
# Painel web: expediente.
rotacerta.credencial.validade-token-painel=8h
rotacerta.credencial.validade-codigo-ativacao=72h
rotacerta.credencial.max-falhas-login=5
rotacerta.credencial.tempo-bloqueio=15m

# --- Hash de senha/PIN: Argon2id + salt (tabela seguranca.chave_salt) + pepper (.env) ---
rotacerta.seguranca.pepper=${ROTACERTA_PEPPER}
# A chave de salt vale 30 dias; depois disso o login exige troca de senha/PIN.
rotacerta.seguranca.validade-chave-salt=30d
# Parâmetros mínimos recomendados pela OWASP para Argon2id (m=19 MiB, t=2, p=1).
rotacerta.seguranca.argon2.memoria-kib=19456
rotacerta.seguranca.argon2.iteracoes=2
rotacerta.seguranca.argon2.paralelismo=1
rotacerta.seguranca.argon2.tamanho-hash=32
rotacerta.seguranca.argon2.tamanho-salt=16

# --- Primeiro ADMINISTRATIVO ---
rotacerta.bootstrap.admin.nome=Administrador Inicial
rotacerta.bootstrap.admin.email=${ROTACERTA_ADMIN_EMAIL}
rotacerta.bootstrap.admin.senha=${ROTACERTA_ADMIN_SENHA}
