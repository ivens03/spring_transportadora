# =====================================================================
# Configuração COMUM a todos os perfis.
# Perfis: dev (padrão, application-dev.properties) e prod (application-prod.properties).
#   dev : ./mvnw spring-boot:run
#   prod: SPRING_PROFILES_ACTIVE=prod java -jar target/spring.transportadora-*.jar
# =====================================================================
spring.application.name=rotacerta
spring.profiles.default=dev

server.port=${SERVER_PORT:8085}

# --- Banco (valores vêm do .env no dev e de variáveis de ambiente no prod) ---
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Paginação das listagens (?page=0&size=20&sort=campo,asc) ---
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# --- Swagger / OpenAPI (cada perfil define o título e se fica ligado) ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.default-produces-media-type=application/json

# --- Token (JWT) ---
rotacerta.jwt.emissor=rotacerta
rotacerta.jwt.segredo=${ROTACERTA_JWT_SEGREDO}

# --- Credenciais ---
# App do entregador: token cobre a jornada (conexão instável, evita relogin na rua).
rotacerta.credencial.validade-token-app=12h
# Painel web: expediente.
rotacerta.credencial.validade-token-painel=8h
rotacerta.credencial.validade-codigo-ativacao=72h
rotacerta.credencial.max-falhas-login=5
rotacerta.credencial.tempo-bloqueio=15m

# --- Hash de senha/PIN: Argon2id + salt (tabela seguranca.chave_salt) + pepper ---
rotacerta.seguranca.pepper=${ROTACERTA_PEPPER}
# A chave de salt vale 30 dias; depois disso o login exige troca de senha/PIN.
rotacerta.seguranca.validade-chave-salt=30d
# Parâmetros mínimos recomendados pela OWASP para Argon2id (m=19 MiB, t=2, p=1).
rotacerta.seguranca.argon2.memoria-kib=19456
rotacerta.seguranca.argon2.iteracoes=2
rotacerta.seguranca.argon2.paralelismo=1
rotacerta.seguranca.argon2.tamanho-hash=32
rotacerta.seguranca.argon2.tamanho-salt=16

# --- Primeiro ADMINISTRATIVO (criado na subida se ainda não existir nenhum) ---
rotacerta.bootstrap.admin.nome=Administrador Inicial
rotacerta.bootstrap.admin.email=${ROTACERTA_ADMIN_EMAIL}
rotacerta.bootstrap.admin.senha=${ROTACERTA_ADMIN_SENHA}

# Frota: métricas de consumo (Financeiro)
# fuso das datas inicio/fim do filtro
rotacerta.frota.fuso-horario=America/Fortaleza
# km/l até 15% abaixo da referência ainda é "dentro do esperado"
rotacerta.frota.tolerancia-consumo-percentual=15
# período padrão das métricas quando inicio/fim não vêm
rotacerta.frota.periodo-padrao-dias=30

# Roteirização (rotas do Suporte / app do entregador)
# depósito de onde as rotas saem quando o pedido não informa origem
rotacerta.rota.origem.nome=CD Fortaleza
rotacerta.rota.origem.latitude=-3.731900
rotacerta.rota.origem.longitude=-38.526700
# linha reta x fator = estimativa da distância pelas ruas (sem serviço de mapas)
rotacerta.rota.fator-distancia-viaria=1.3
rotacerta.rota.velocidade-media-km-h=25
rotacerta.rota.minutos-por-parada=5
rotacerta.rota.max-paradas=60
rotacerta.rota.max-posicoes-por-lote=500
# relógio do celular pode estar adiantado até isto
rotacerta.rota.tolerancia-relogio=5m

# Webhooks do Portal do Cliente (padrões de PRODUÇÃO: seguros)
# só https e nunca IP interno (localhost, 10.x, 192.168.x, 169.254.x...): evita SSRF
rotacerta.webhook.exigir-https=true
rotacerta.webhook.permitir-rede-interna=false
rotacerta.webhook.max-por-cliente=5
# no máximo 1 aviso de LOCALIZACAO por encomenda neste intervalo
rotacerta.webhook.intervalo-localizacao=60s
# retentativa: 30s, 1min, 2min, 4min... (teto 1h), desiste na 8ª
rotacerta.webhook.max-tentativas=8
rotacerta.webhook.espera-inicial=30s
rotacerta.webhook.espera-maxima=1h
rotacerta.webhook.timeout-conexao=3s
rotacerta.webhook.timeout-resposta=5s
# despachante: roda a cada intervalo (ISO-8601) e pega até N avisos por rodada
rotacerta.webhook.despacho-automatico=true
rotacerta.webhook.intervalo-despacho=PT2S
rotacerta.webhook.lote-despacho=20
rotacerta.webhook.reserva=2m

# Nome da rua pela posição do GPS (rastreio e webhook de LOCALIZACAO). Nominatim/OpenStreetMap: grátis, sem
# chave, no máx. 1 consulta/s (o cache por ~11 m segura isso). Se cair, o rastreio segue sem a rua.
rotacerta.rua.ativo=true
rotacerta.rua.url=https://nominatim.openstreetmap.org/reverse
rotacerta.rua.timeout=2s
rotacerta.rua.intervalo-minimo=1s
rotacerta.rua.pausa-apos-falha=1m

# Contas FIXAS de teste (uma por perfil de acesso). Só são criadas fora de prod e com
# rotacerta.bootstrap.teste.ativo=true (ligado nos perfis dev e homolog; ver ContasTesteConfig).
rotacerta.bootstrap.teste.usuarios.administrativo.matricula=${ROTACERTA_TESTE_ADMINISTRATIVO_MATRICULA:}
rotacerta.bootstrap.teste.usuarios.administrativo.nome=Teste Administrativo
rotacerta.bootstrap.teste.usuarios.administrativo.email=${ROTACERTA_TESTE_ADMINISTRATIVO_EMAIL:}
rotacerta.bootstrap.teste.usuarios.administrativo.credencial=${ROTACERTA_TESTE_ADMINISTRATIVO_SENHA:}
rotacerta.bootstrap.teste.usuarios.suporte.matricula=${ROTACERTA_TESTE_SUPORTE_MATRICULA:}
rotacerta.bootstrap.teste.usuarios.suporte.nome=Teste Suporte
rotacerta.bootstrap.teste.usuarios.suporte.email=${ROTACERTA_TESTE_SUPORTE_EMAIL:}
rotacerta.bootstrap.teste.usuarios.suporte.credencial=${ROTACERTA_TESTE_SUPORTE_SENHA:}
rotacerta.bootstrap.teste.usuarios.financeiro.matricula=${ROTACERTA_TESTE_FINANCEIRO_MATRICULA:}
rotacerta.bootstrap.teste.usuarios.financeiro.nome=Teste Financeiro
rotacerta.bootstrap.teste.usuarios.financeiro.email=${ROTACERTA_TESTE_FINANCEIRO_EMAIL:}
rotacerta.bootstrap.teste.usuarios.financeiro.credencial=${ROTACERTA_TESTE_FINANCEIRO_SENHA:}
rotacerta.bootstrap.teste.usuarios.desenvolvimento.matricula=${ROTACERTA_TESTE_DESENVOLVIMENTO_MATRICULA:}
rotacerta.bootstrap.teste.usuarios.desenvolvimento.nome=Teste Desenvolvimento
rotacerta.bootstrap.teste.usuarios.desenvolvimento.email=${ROTACERTA_TESTE_DESENVOLVIMENTO_EMAIL:}
rotacerta.bootstrap.teste.usuarios.desenvolvimento.credencial=${ROTACERTA_TESTE_DESENVOLVIMENTO_SENHA:}
rotacerta.bootstrap.teste.usuarios.entregador.matricula=${ROTACERTA_TESTE_ENTREGADOR_MATRICULA:}
rotacerta.bootstrap.teste.usuarios.entregador.nome=Teste Entregador
rotacerta.bootstrap.teste.usuarios.entregador.credencial=${ROTACERTA_TESTE_ENTREGADOR_PIN:}
rotacerta.bootstrap.teste.usuarios.cliente.matricula=${ROTACERTA_TESTE_CLIENTE_MATRICULA:}
rotacerta.bootstrap.teste.usuarios.cliente.nome=Teste Cliente
rotacerta.bootstrap.teste.usuarios.cliente.email=${ROTACERTA_TESTE_CLIENTE_EMAIL:}
rotacerta.bootstrap.teste.usuarios.cliente.credencial=${ROTACERTA_TESTE_CLIENTE_SENHA:}
