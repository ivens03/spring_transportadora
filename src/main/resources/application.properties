spring.application.name=rotacerta
server.port=${PORT:8085}

# Banco: em dev o Postgres sobe pelo compose.yaml (spring-boot-docker-compose preenche a URL sozinho).
spring.docker.compose.lifecycle-management=start-only
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true

# --- Credenciais e token ---
rotacerta.jwt.emissor=rotacerta
# Segredo HMAC do JWT (>= 32 bytes). Valor abaixo e SO para desenvolvimento local: em qualquer ambiente real use a env var.
rotacerta.jwt.segredo=${ROTACERTA_JWT_SEGREDO:dev-local-apenas-troque-em-producao-0123456789abcdef}
# App do entregador: token cobre a jornada (conexao instavel, evita relogin na rua).
rotacerta.credencial.validade-token-app=12h
# Painel web: expediente.
rotacerta.credencial.validade-token-painel=8h
rotacerta.credencial.validade-codigo-ativacao=72h
rotacerta.credencial.max-falhas-login=5
rotacerta.credencial.tempo-bloqueio=15m

# --- Primeiro ADMINISTRATIVO (criado na subida se ainda nao existir nenhum) ---
rotacerta.bootstrap.admin.nome=Administrador Inicial
rotacerta.bootstrap.admin.email=${ROTACERTA_ADMIN_EMAIL:admin@rotacerta.local}
rotacerta.bootstrap.admin.senha=${ROTACERTA_ADMIN_SENHA:RotaCerta2026}
