# =====================================================================
# Configuração COMUM a todos os perfis.
# Perfis: dev (padrão, application-dev.properties) e prod (application-prod.properties).
#   dev : ./mvnw spring-boot:run
#   prod: SPRING_PROFILES_ACTIVE=prod java -jar target/spring.transportadora-*.jar
# =====================================================================
spring.application.name=rotacerta
spring.profiles.default=dev

server.port=${SERVER_PORT:8085}

# --- Banco (valores vêm do .env no dev e de variáveis de ambiente no prod) ---
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Paginação das listagens (?page=0&size=20&sort=campo,asc) ---
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# --- Swagger / OpenAPI (cada perfil define o título e se fica ligado) ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.default-produces-media-type=application/json

# --- Token (JWT) ---
rotacerta.jwt.emissor=rotacerta
rotacerta.jwt.segredo=${ROTACERTA_JWT_SEGREDO}

# --- Credenciais ---
# App do entregador: token cobre a jornada (conexão instável, evita relogin na rua).
rotacerta.credencial.validade-token-app=12h
# Painel web: expediente.
rotacerta.credencial.validade-token-painel=8h
rotacerta.credencial.validade-codigo-ativacao=72h
rotacerta.credencial.max-falhas-login=5
rotacerta.credencial.tempo-bloqueio=15m

# --- Hash de senha/PIN: Argon2id + salt (tabela seguranca.chave_salt) + pepper ---
rotacerta.seguranca.pepper=${ROTACERTA_PEPPER}
# A chave de salt vale 30 dias; depois disso o login exige troca de senha/PIN.
rotacerta.seguranca.validade-chave-salt=30d
# Parâmetros mínimos recomendados pela OWASP para Argon2id (m=19 MiB, t=2, p=1).
rotacerta.seguranca.argon2.memoria-kib=19456
rotacerta.seguranca.argon2.iteracoes=2
rotacerta.seguranca.argon2.paralelismo=1
rotacerta.seguranca.argon2.tamanho-hash=32
rotacerta.seguranca.argon2.tamanho-salt=16

# --- Primeiro ADMINISTRATIVO (criado na subida se ainda não existir nenhum) ---
rotacerta.bootstrap.admin.nome=Administrador Inicial
rotacerta.bootstrap.admin.email=${ROTACERTA_ADMIN_EMAIL}
rotacerta.bootstrap.admin.senha=${ROTACERTA_ADMIN_SENHA}

# Frota: métricas de consumo (Financeiro)
# fuso das datas inicio/fim do filtro
rotacerta.frota.fuso-horario=America/Fortaleza
# km/l até 15% abaixo da referência ainda é "dentro do esperado"
rotacerta.frota.tolerancia-consumo-percentual=15
# período padrão das métricas quando inicio/fim não vêm
rotacerta.frota.periodo-padrao-dias=30
