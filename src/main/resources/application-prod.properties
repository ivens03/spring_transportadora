# =====================================================================
# Perfil PROD: servidor.
# - NÃO lê .env: tudo vem de variáveis de ambiente de verdade
#   (POSTGRES_*, ROTACERTA_JWT_SEGREDO, ROTACERTA_PEPPER, ROTACERTA_ADMIN_EMAIL ...).
#   Se faltar alguma obrigatória, a aplicação NÃO sobe (falha rápido, sem valor padrão inseguro).
# - sem docker compose, log enxuto, desligamento gracioso
# =====================================================================
spring.docker.compose.enabled=false

server.port=${SERVER_PORT:8080}
# Endereço base: https://<servidor>/transportadora/api/v1/...
server.servlet.context-path=/transportadora
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# Atrás de proxy/load balancer: respeita X-Forwarded-* (IP real, https)
server.forward-headers-strategy=framework
server.compression.enabled=true
server.error.include-stacktrace=never
server.error.include-message=never

# Pool de conexões (ajustável por variável de ambiente)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}

# Flyway nunca apaga o banco e valida as migrations antes de subir
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

# Log enxuto
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.br.com.fametro.spring.transportadora=INFO

# Swagger PROD: https://<servidor>/transportadora/swagger-ui.html
# Pode ser desligado no servidor com SWAGGER_ENABLED=false
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.persist-authorization=false
rotacerta.openapi.ambiente=PROD - producao

# Primeiro administrativo: só é criado se ROTACERTA_ADMIN_SENHA existir.
# Depois da primeira subida, remova a variável do servidor.
rotacerta.bootstrap.admin.senha=${ROTACERTA_ADMIN_SENHA:}

# Banner
rotacerta.banner.perfil=PROD (producao)
rotacerta.banner.cor=BRIGHT_RED
