# =====================================================================
# Perfil DEV (padrão): máquina do desenvolvedor.
# - segredos e banco vêm do .env (fora do git)
# - o Postgres sobe sozinho pelo compose.yaml (spring-boot-docker-compose)
# - log detalhado, inclusive o SQL gerado pelo Hibernate
# =====================================================================
spring.config.import=optional:file:.env[.properties]

# Endereço base: http://localhost:8085/transportadora_dev/api/v1/...
server.servlet.context-path=/transportadora_dev

spring.docker.compose.enabled=true
spring.docker.compose.lifecycle-management=start-only

# Mostra o SQL executado (útil para estudar o que o JPA faz)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.properties.hibernate.format_sql=true
logging.level.br.com.fametro.spring.transportadora=DEBUG

# Swagger DEV: http://localhost:8085/transportadora_dev/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# Mantém o token colado no "Authorize" ao recarregar a página
springdoc.swagger-ui.persist-authorization=true
rotacerta.openapi.ambiente=DEV - desenvolvimento

# Banner
rotacerta.banner.perfil=DEV  (desenvolvimento local)
rotacerta.banner.cor=BRIGHT_GREEN

# Contas FIXAS de teste, uma por perfil (valores no .env). Recriadas/renovadas a cada subida. Nunca em prod.
rotacerta.bootstrap.teste.ativo=${ROTACERTA_TESTE_ATIVO:false}
rotacerta.bootstrap.teste.usuarios.administrativo.matricula=${ROTACERTA_TESTE_ADMINISTRATIVO_MATRICULA:}
rotacerta.bootstrap.teste.usuarios.administrativo.nome=Teste Administrativo
rotacerta.bootstrap.teste.usuarios.administrativo.email=${ROTACERTA_TESTE_ADMINISTRATIVO_EMAIL:}
rotacerta.bootstrap.teste.usuarios.administrativo.credencial=${ROTACERTA_TESTE_ADMINISTRATIVO_SENHA:}
rotacerta.bootstrap.teste.usuarios.suporte.matricula=${ROTACERTA_TESTE_SUPORTE_MATRICULA:}
rotacerta.bootstrap.teste.usuarios.suporte.nome=Teste Suporte
rotacerta.bootstrap.teste.usuarios.suporte.email=${ROTACERTA_TESTE_SUPORTE_EMAIL:}
rotacerta.bootstrap.teste.usuarios.suporte.credencial=${ROTACERTA_TESTE_SUPORTE_SENHA:}
rotacerta.bootstrap.teste.usuarios.financeiro.matricula=${ROTACERTA_TESTE_FINANCEIRO_MATRICULA:}
rotacerta.bootstrap.teste.usuarios.financeiro.nome=Teste Financeiro
rotacerta.bootstrap.teste.usuarios.financeiro.email=${ROTACERTA_TESTE_FINANCEIRO_EMAIL:}
rotacerta.bootstrap.teste.usuarios.financeiro.credencial=${ROTACERTA_TESTE_FINANCEIRO_SENHA:}
rotacerta.bootstrap.teste.usuarios.desenvolvimento.matricula=${ROTACERTA_TESTE_DESENVOLVIMENTO_MATRICULA:}
rotacerta.bootstrap.teste.usuarios.desenvolvimento.nome=Teste Desenvolvimento
rotacerta.bootstrap.teste.usuarios.desenvolvimento.email=${ROTACERTA_TESTE_DESENVOLVIMENTO_EMAIL:}
rotacerta.bootstrap.teste.usuarios.desenvolvimento.credencial=${ROTACERTA_TESTE_DESENVOLVIMENTO_SENHA:}
rotacerta.bootstrap.teste.usuarios.entregador.matricula=${ROTACERTA_TESTE_ENTREGADOR_MATRICULA:}
rotacerta.bootstrap.teste.usuarios.entregador.nome=Teste Entregador
rotacerta.bootstrap.teste.usuarios.entregador.credencial=${ROTACERTA_TESTE_ENTREGADOR_PIN:}
