# =====================================================================
# Perfil HOMOLOG: servidor de demonstração (VPS com Dokploy).
# Igual ao prod (variáveis de ambiente, /transportadora, webhooks só https), MAS com as contas
# fixas de teste ligadas, para apresentar o sistema com os mesmos logins do dev.
# - NÃO lê .env: tudo vem das variáveis de ambiente do container (POSTGRES_*, ROTACERTA_*)
# =====================================================================
spring.docker.compose.enabled=false

server.port=${SERVER_PORT:8080}
# Endereço base: https://<servidor>/transportadora/api/v1/...
server.servlet.context-path=/transportadora
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# Atrás do Traefik: respeita X-Forwarded-* (IP real, https)
server.forward-headers-strategy=framework
server.compression.enabled=true
server.error.include-stacktrace=never
server.error.include-message=never

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}

spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.br.com.fametro.spring.transportadora=INFO

# Swagger: https://<servidor>/transportadora/swagger-ui.html
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.persist-authorization=true
rotacerta.openapi.ambiente=HOMOLOG - demonstracao

# Primeiro administrativo: só é criado se ROTACERTA_ADMIN_SENHA existir.
rotacerta.bootstrap.admin.senha=${ROTACERTA_ADMIN_SENHA:}

rotacerta.banner.perfil=HOMOLOG (demonstracao)
rotacerta.banner.cor=BRIGHT_YELLOW

# Contas fixas de teste (mapeamento em application.properties). Renovadas a cada subida.
rotacerta.bootstrap.teste.ativo=${ROTACERTA_TESTE_ATIVO:true}

# Localização a cada 15s nos webhooks, para ver o carro andando na apresentação
rotacerta.webhook.intervalo-localizacao=15s
