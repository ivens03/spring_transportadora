# Variáveis vêm do .env (o docker compose lê automaticamente o .env desta pasta).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - rotacerta-pg:/var/lib/postgresql/data

volumes:
  rotacerta-pg:
